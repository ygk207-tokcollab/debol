services:
  - type: web
    name: debol
    runtime: node
    plan: free
    # Everything `npm run build` needs (typescript, vite, tsx and every @types/*) is in
    # `dependencies`, never `devDependencies`: a build here that omits devDependencies is a normal
    # thing to happen, and `tsc --noEmit` then fails on the untyped `pg` / `busboy` imports.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Vite 7 needs Node 20.19+/22.12+ and the app is run straight from TypeScript via tsx.
      # Without a pin Render picks its own default and the build can fail outright.
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 10000
      # Neon pooled connection string. Mark it as a Secret in the dashboard; sync: false means the
      # blueprint asks for the value instead of storing it in git.
      - key: DATABASE_URL
        sync: false
      # scrypt-hashed onto the owner accounts at boot so a fresh database can be signed into.
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # Optional: only needed if the SPA is hosted somewhere other than this service.
      - key: ALLOWED_ORIGINS
        sync: false
