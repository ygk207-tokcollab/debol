spring:
  application:
    name: kids-store-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:kidsstore_dev}
    username: ${DB_USER:kidsstore}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:12}
      connection-timeout: 8000
      pool-name: kidsstore-pool
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that the mappings match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 25
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Above kidsstore.storage.max-upload-bytes on purpose: the request has to reach the
      # upload check so the admin gets "image too large" instead of a container error page.
      max-file-size: 20MB
      max-request-size: 25MB
  web:
    resources:
      add-mappings: true

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    min-response-size: 2048
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    # Matches multipart.max-request-size so every oversized upload reaches the app's own
    # image_too_large check instead of a container-level rejection.
    max-http-form-post-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

kidsstore:
  store:
    bootstrap-admin-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    bootstrap-admin-name: ${ADMIN_BOOTSTRAP_NAME:Store owner}
    currency-label: ${CURRENCY_LABEL:ETB}
  security:
    jwt-secret: ${JWT_SECRET:}
    admin-token-minutes: ${ADMIN_TOKEN_MINUTES:480}
    customer-token-days: ${CUSTOMER_TOKEN_DAYS:30}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
    dev-auth-enabled: ${DEV_AUTH_ENABLED:false}
    allow-phone-login: ${ALLOW_PHONE_LOGIN:true}
    login-attempts-per-minute: ${LOGIN_ATTEMPTS_PER_MINUTE:5}
    checkout-attempts-per-minute: ${CHECKOUT_ATTEMPTS_PER_MINUTE:10}
    init-data-max-age-seconds: ${INIT_DATA_MAX_AGE_SECONDS:86400}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    enabled: ${TELEGRAM_ENABLED:true}
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:true}
    polling-timeout-seconds: ${TELEGRAM_POLLING_TIMEOUT_SECONDS:25}
    admin-contact-phone: ${TELEGRAM_ADMIN_CONTACT_PHONE:0911526922}
    pairing-code-ttl-minutes: ${TELEGRAM_PAIRING_TTL_MINUTES:15}
    enforce-callback-chat: ${TELEGRAM_ENFORCE_CALLBACK_CHAT:true}
    dispatch-batch-size: ${TELEGRAM_DISPATCH_BATCH_SIZE:10}
    dispatch-interval-ms: ${TELEGRAM_DISPATCH_INTERVAL_MS:5000}
    backoff-base-seconds: ${TELEGRAM_BACKOFF_BASE_SECONDS:15}
    backoff-max-seconds: ${TELEGRAM_BACKOFF_MAX_SECONDS:1800}
    max-attempts: ${TELEGRAM_MAX_ATTEMPTS:8}
  storage:
    driver: ${STORAGE_DRIVER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:/api/v1/media}
    max-upload-bytes: ${STORAGE_MAX_UPLOAD_BYTES:8388608}

logging:
  level:
    root: INFO
    com.kidsstore: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
