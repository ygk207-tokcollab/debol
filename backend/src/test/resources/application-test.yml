# Test profile: mirrors src/main/resources/application.yml property names exactly.
# Everything here is throwaway local-test configuration. No real secret is present.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/kidsstore_test
    username: kidsstore
    # Throwaway local-dev password default only; never a production credential.
    password: ${DB_PASSWORD:kidsstore}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 8000
      pool-name: kidsstore-test-pool
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    clean-disabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 25
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 0

kidsstore:
  store:
    bootstrap-admin-email: ""
    bootstrap-admin-password: ""
    bootstrap-admin-name: "Test owner"
    currency-label: "ETB"
  security:
    # Fixed throwaway HS256 test secret (>= 32 bytes). Not used anywhere real.
    jwt-secret: "kidsstore-only-a-test-hs256-secret-value-please-never-ship-32b"
    admin-token-minutes: 480
    customer-token-days: 30
    allowed-origins: "http://localhost:5173"
    dev-auth-enabled: false
    allow-phone-login: true
    # Raised so repeated in-test logins/checkouts never trip the fixed window.
    login-attempts-per-minute: 100000
    checkout-attempts-per-minute: 100000
    init-data-max-age-seconds: 86400
  telegram:
    bot-token: ""
    api-base-url: "https://api.telegram.org"
    enabled: false
    polling-enabled: false
    polling-timeout-seconds: 1
    admin-contact-phone: "0911526922"
    pairing-code-ttl-minutes: 15
    enforce-callback-chat: true
    dispatch-batch-size: 50
    dispatch-interval-ms: 3600000
    backoff-base-seconds: 15
    backoff-max-seconds: 1800
    max-attempts: 8
  storage:
    driver: "local"
    local-dir: "./build/test-uploads"
    public-base-url: "/api/v1/media"
    max-upload-bytes: 8388608

logging:
  level:
    root: WARN
    com.kidsstore: INFO
    org.hibernate.SQL: WARN
